name: UMI UEFI + boot.img Build

on:
  workflow_dispatch:
    inputs:
      ram_check:
        description: "payload (diagnostic) | xnu-entry (XNU kernel payload)"
        default: payload
        type: choice
        options:
          - payload
          - xnu-entry

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout UMI device repo (this fork)
        uses: actions/checkout@v4
        with:
          path: devices/umi
          submodules: recursive

      - name: Checkout pinned UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 7b52e7968c76453cdc18b5aa174fc368d5293b91
          path: sources/UniXNU
          submodules: recursive

      - name: Checkout pinned uefi-umi (with submodules)
        uses: actions/checkout@v4
        with:
          repository: reAAAq/uefi-umi
          ref: 48bc41218c480519bfd299c22205f44e418df9d0
          path: sources/uefi-umi
          submodules: recursive

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        run: brew install cmake ninja unifdef llvm dtc mtools

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare workspace
        run: |
          mkdir -p tools
          # build_umi_uefi.py lives in bringup/tools, not the repo-root tools/
          cp -a devices/umi/bringup/tools/. ./tools/
          python -m pip install --upgrade pip
          if [ -f sources/UniXNU/scripts/requirements.txt ]; then
            python -m pip install -r sources/UniXNU/scripts/requirements.txt
          fi

      - name: Unpack committed evidence (if present)
        run: |
          if [ -f local-inputs/evidence.zip ]; then
            mkdir -p local-inputs/evidence
            unzip -o local-inputs/evidence.zip -d local-inputs/evidence
          fi

      - name: Fetch evidence from release (optional)
        env:
          EVIDENCE_URL: ${{ secrets.UMI_EVIDENCE_URL }}
        run: |
          if [ -n "$EVIDENCE_URL" ]; then
            mkdir -p local-inputs/evidence
            curl -fL "$EVIDENCE_URL" -o /tmp/evidence.zip
            unzip -o /tmp/evidence.zip -d local-inputs/evidence
          fi

      - name: Verify local inputs are present
        run: |
          test -f local-inputs/uefi-binaries/manifest.json || { echo "missing local-inputs/uefi-binaries"; exit 1; }
          test -f local-inputs/evidence/report.json || { echo "missing local-inputs/evidence/report.json"; exit 1; }
          test -f local-inputs/evidence/running.dtb || { echo "missing local-inputs/evidence/running.dtb"; exit 1; }
          echo "inputs ok"

      - name: Build source kernel
        run: python tools/build_umi_xnu.py --stage all --jobs 4

      - name: Generate XNU baselines (xnu-entry only)
        if: ${{ inputs.ram_check == 'xnu-entry' }}
        env:
          SEED: ${{ secrets.UMI_UNIQUE_CHIP_ID }}
        run: |
          mkdir -p out/umi/adt
          SEED_ARG=""
          if [ -n "$SEED" ]; then SEED_ARG="--unique-chip-id $SEED"; fi
          python devices/umi/scripts/make-umi-adt.py --output out/umi/adt/umi.adt \
            --dram-size 0x1FBB00000 --owned-memory-size 0x10000000 \
            --chip-id 0x164 --cpu-regs 0,0x100,0x200,0x300,0x400,0x500,0x600,0x700 \
            --psci-method smc $SEED_ARG
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          adt = Path("out/umi/adt/umi.adt").resolve()
          Path("out/umi/adt-baseline.json").write_text(json.dumps({"output": str(adt), "adt_sha256": hashlib.sha256(adt.read_bytes()).hexdigest()}))
          k = Path("out/umi-xnu/umi/kernel/source-kernel.macho").resolve()
          Path("out/umi/xnu-entry-baseline.json").write_text(json.dumps({"kernel": {"kernel": str(k), "sha256": hashlib.sha256(k.read_bytes()).hexdigest()}}))
          PY

      - name: Build UEFI firmware + boot image
        run: |
          python tools/build_umi_uefi.py \
            --firmware local-inputs \
            --evidence local-inputs/evidence \
            --display-profile inherited \
            --input-profile buttons \
            --payload-profile ram \
            --loader-profile darwinboot \
            --ram-check ${{ inputs.ram_check }} \
            -j 4

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umi-uefi-bootimg-${{ github.run_number }}
          path: |
            out/umi/
            out/umi-xnu/**
            sources/uefi-umi/Build/umiPkg/**/FV/SILICIUM_UEFI.fd
          if-no-files-found: warn
          retention-days: 7
